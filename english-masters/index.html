<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>English Masters Game</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800;900&display=swap">
<style>
/* Layout: a TV-quiz stage. Scoreboard on top, the round in the middle with the host girl beside it, round dock at the bottom. */
:root{
  --navy:#0d2160; --deep:#060f33; --ink:#0a1638; --gold:#ffc93c; --gold2:#e39a14; --cream:#fff3c4;
  --red:#d5221b; --redl:#ff6a5a; --blue:#1d4fd0; --bluel:#5d90ff; --ok:#2fc46b; --bad:#ff5a50;
  --fd:'Lilita One','Arial Black',Impact,sans-serif; --fb:'Nunito','Segoe UI',Arial,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--deep) url(a/bg.webp) center/cover no-repeat fixed;color:var(--cream);font-family:var(--fb);overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.app{height:100%;display:grid;grid-template-rows:auto 1fr auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* scoreboard */
.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding-block:10px}
.team{display:flex;align-items:center;gap:10px;min-width:0}
.team.e{justify-content:flex-end}
.team img{width:clamp(44px,5.5vw,76px);height:auto;filter:drop-shadow(0 4px 6px #0008)}
.tn{font-family:var(--fd);font-size:clamp(16px,1.9vw,28px);letter-spacing:.02em;line-height:1}
.tn small{display:block;font-family:var(--fb);font-weight:800;font-size:.5em;opacity:.75;letter-spacing:.08em;text-transform:uppercase}
.score{font-family:var(--fd);font-size:clamp(30px,4.4vw,64px);min-width:2.2ch;text-align:center;padding:2px 14px;border-radius:16px;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.1;box-shadow:inset 0 4px 8px #fff8,inset 0 -6px 10px #0005,0 6px 14px #0007}
.p .score{background:linear-gradient(160deg,var(--redl),var(--red));color:#fff}
.e .score{background:linear-gradient(160deg,var(--bluel),var(--blue));color:#fff}
.score.pop{animation:pop .5s}
@keyframes pop{40%{transform:scale(1.25)}}
.adj{display:flex;flex-direction:column;gap:4px}
.adj button{width:30px;height:24px;border-radius:8px;background:#ffffff1a;font-weight:900;font-size:16px;line-height:1}
.adj button:hover{background:#ffffff33}
.logo{display:flex;align-items:center;gap:10px;justify-content:center;text-align:center}
.logo img{width:clamp(40px,4.6vw,64px)}
.logo b{font-family:var(--fd);font-size:clamp(18px,2.4vw,36px);color:var(--gold);text-shadow:0 3px 0 #7a4a00,0 0 18px #ffb00055;line-height:1}
.logo span{display:block;font-size:clamp(10px,.9vw,13px);font-weight:800;letter-spacing:.2em;text-transform:uppercase;opacity:.8}

/* stage */
.stage{position:relative;min-height:0;overflow:hidden}
.content{position:absolute;inset:0;overflow:auto;padding:8px 0 16px;display:flex;flex-direction:column;align-items:center;gap:14px}
.stage.gR .content{right:24%}
.stage.gL .content{left:24%}
.girl{position:absolute;bottom:0;height:92%;max-height:760px;pointer-events:none;transition:left .6s,right .6s,opacity .3s;z-index:1}
.girl img{height:100%;width:auto;filter:drop-shadow(0 12px 18px #0009)}
.stage.gR .girl{right:2%}
.stage.gL .girl{left:2%}
.stage.gL .girl img{transform:scaleX(-1)}
.bubble{position:absolute;top:2%;width:min(260px,22vw);background:var(--cream);color:var(--ink);border-radius:18px;padding:10px 14px;font-weight:800;font-size:clamp(12px,1.05vw,16px);line-height:1.3;box-shadow:0 8px 18px #0007;z-index:2;animation:bub .5s}
.stage.gR .bubble{right:1%}
.stage.gL .bubble{left:1%}
@keyframes bub{from{transform:translateY(10px) scale(.9);opacity:0}}

.h1{font-family:var(--fd);font-size:clamp(30px,4.2vw,64px);color:var(--gold);text-align:center;line-height:1.02;text-shadow:0 4px 0 #7a4a00,0 0 30px #ffb00055;text-wrap:balance;margin:0}
.pill{display:inline-block;background:linear-gradient(180deg,var(--gold),var(--gold2));color:var(--ink);font-weight:900;letter-spacing:.14em;text-transform:uppercase;font-size:clamp(11px,1vw,15px);padding:6px 16px;border-radius:999px;box-shadow:0 4px 10px #0006}
.sub{font-size:clamp(14px,1.35vw,20px);text-align:center;max-width:62ch;opacity:.92;margin:0;text-wrap:balance}
.row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;align-items:center}
.card{background:linear-gradient(180deg,#132b78ee,#0a1a52ee);border:2px solid #ffc93c88;border-radius:20px;padding:14px 18px;box-shadow:0 10px 24px #0008}
.btn{padding:10px 20px;border-radius:14px;font-weight:900;font-size:clamp(14px,1.2vw,18px);background:linear-gradient(180deg,var(--gold),var(--gold2));color:var(--ink);box-shadow:inset 0 3px 6px #fff8,0 5px 12px #0007;transition:transform .12s}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:#ffffff14;color:var(--cream);box-shadow:inset 0 0 0 2px #ffc93c66}
.btn.p{background:linear-gradient(180deg,var(--redl),var(--red));color:#fff}
.btn.e{background:linear-gradient(180deg,var(--bluel),var(--blue));color:#fff}
.btn:disabled{opacity:.4;pointer-events:none}

/* timer */
.timer{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:center}
.ring{position:relative;width:clamp(96px,9vw,132px);aspect-ratio:1}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .t{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--fd);font-size:clamp(24px,2.5vw,38px);color:var(--gold);font-variant-numeric:tabular-nums}
.ring.warn .t{color:var(--bad);animation:pulse .5s infinite alternate}
.ring.done .t{color:var(--bad)}
@keyframes pulse{to{transform:scale(1.12)}}
.tl{font-weight:900;letter-spacing:.12em;text-transform:uppercase;font-size:12px;opacity:.75;text-align:center}

/* home */
.hero-girl{display:none}
.journey{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.node{text-align:center;padding:8px 12px;border-radius:14px;background:#ffffff10;border:1px solid #ffc93c55;min-width:92px}
.node b{display:block;font-family:var(--fd);color:var(--gold);font-size:clamp(14px,1.3vw,19px)}
.node small{font-weight:800;opacity:.8}
.node.final{background:linear-gradient(180deg,var(--gold),var(--gold2));color:var(--ink)}
.node.final b{color:var(--ink)}

/* teams */
.vs{font-family:var(--fd);font-size:clamp(40px,5vw,80px);color:var(--gold);text-shadow:0 4px 0 #7a4a00}
.tcard{width:min(320px,90%);text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.tcard img{width:min(170px,60%)}
.tcard.p{border-color:var(--redl)}
.tcard.e{border-color:var(--bluel)}
.tcard input{width:100%;padding:8px 10px;border-radius:10px;border:2px solid #ffffff30;background:#00000040;color:var(--cream);font:800 15px var(--fb);text-align:center}

/* question */
.q{font-size:clamp(20px,2.3vw,36px);font-weight:900;text-align:center;line-height:1.25;max-width:30ch;text-wrap:balance;margin:0}
.q .blank{color:var(--gold)}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;width:min(820px,100%)}
.opt{display:flex;gap:12px;align-items:center;text-align:left;padding:12px 16px;border-radius:16px;background:#0a1a52e6;border:2px solid #ffc93c66;font-weight:900;font-size:clamp(15px,1.5vw,22px);transition:transform .12s,background .2s}
.opt:hover{transform:translateY(-2px);border-color:var(--gold)}
.opt i{font-style:normal;flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--gold);color:var(--ink);font-family:var(--fd)}
.opt.right{background:#1f8f4f;border-color:#8dffb8;animation:pop .5s}
.opt.wrong{background:#8f1f1f;border-color:#ff9a8a;animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.prog{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.prog span{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-weight:900;font-size:13px;background:#ffffff14}
.prog span.cur{background:var(--gold);color:var(--ink)}
.prog span.P{background:var(--red)} .prog span.E{background:var(--blue)} .prog span.X{background:#ffffff30;text-decoration:line-through}
.buzzers{display:flex;gap:16px;align-items:center;justify-content:center;flex-wrap:wrap}
.buzz{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 16px;border-radius:20px;font-weight:900;transition:transform .1s}
.buzz img{width:clamp(80px,8vw,118px)}
.buzz.p{background:#d5221b33;border:2px solid var(--redl)}
.buzz.e{background:#1d4fd033;border:2px solid var(--bluel)}
.buzz.lit{transform:scale(1.08);box-shadow:0 0 0 4px var(--gold),0 0 40px var(--gold)}
.buzz.off{opacity:.35}
.buzz kbd{font:800 12px var(--fb);background:#00000050;padding:2px 8px;border-radius:6px}
.who{font-family:var(--fd);font-size:clamp(18px,1.8vw,28px);min-height:1.3em;text-align:center}

/* detectives */
.sent{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:900px}
.w{padding:8px 12px;border-radius:12px;background:#0a1a52e6;border:2px solid #ffffff26;font-weight:900;font-size:clamp(18px,2vw,30px)}
.w:hover{border-color:var(--gold)}
.w.hit{background:var(--bad);border-color:#ffd0c8;animation:shake .4s}
.w.miss{opacity:.5}
.missions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;width:min(980px,100%)}
.mission{display:flex;flex-direction:column;gap:8px;min-width:0}
.mission h3{margin:0;font-family:var(--fd);color:var(--gold);font-size:clamp(16px,1.4vw,22px);font-weight:400}
.mission .ans{font-weight:800;font-size:clamp(14px,1.2vw,18px);min-height:2.6em}
.mission .ans.hide{filter:blur(8px);user-select:none}
.mini{display:flex;gap:6px;flex-wrap:wrap}
.mini .btn{padding:6px 12px;font-size:14px}
.envelope{width:min(300px,70%);cursor:pointer;transition:transform .3s;filter:drop-shadow(0 14px 18px #0009)}
.envelope:hover{transform:rotate(-4deg) scale(1.04)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.tab{padding:8px 16px;border-radius:999px;background:#ffffff14;font-weight:900;border:2px solid transparent}
.tab.on{background:var(--gold);color:var(--ink)}
.tab.used{border-color:#ffc93c88}

/* topic cards */
.deck{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;width:min(900px,100%)}
.tc{aspect-ratio:4/3;perspective:800px;min-width:0;max-width:100%}
.tc .in{position:relative;width:100%;height:100%;transition:transform .7s;transform-style:preserve-3d}
.tc.open .in{transform:rotateY(180deg)}
.tc .f,.tc .b{position:absolute;inset:0;border-radius:16px;backface-visibility:hidden;display:grid;place-items:center;padding:10px;text-align:center}
.tc .f{background:linear-gradient(150deg,#fff1b0,#ffcf45 35%,#e39a14 80%,#a86507);color:var(--navy);font-family:var(--fd);font-size:clamp(34px,4vw,64px);box-shadow:inset 0 4px 10px #fff9,0 8px 16px #0008}
.tc .b{transform:rotateY(180deg);background:linear-gradient(180deg,#183a9a,#0a1a52);border:3px solid var(--gold);font-weight:900;font-size:clamp(13px,1.25vw,19px);line-height:1.25}
.tc.used .in{opacity:.45}
.judge{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}

/* winner */
.wbox{display:flex;flex-direction:column;align-items:center;gap:12px}
.big{font-family:var(--fd);font-size:clamp(60px,10vw,150px);color:var(--gold);text-shadow:0 6px 0 #7a4a00,0 0 40px #ffb000aa;line-height:1}
.champ{display:flex;flex-direction:column;align-items:center;gap:6px;animation:rise .9s cubic-bezier(.2,1.4,.4,1)}
.champ img{width:min(220px,45vw)}
@keyframes rise{from{transform:translateY(60px) scale(.5);opacity:0}}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}

/* awards */
.awards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;width:min(1000px,100%)}
.aw{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-width:0}
.aw img{width:min(96px,70%)}
.aw h3{margin:0;font-family:var(--fd);font-weight:400;color:var(--gold);font-size:clamp(16px,1.5vw,22px)}
.aw p{margin:0;font-weight:800;font-size:14px;opacity:.9}
.aw input{width:100%;padding:6px 8px;border-radius:10px;border:2px solid #ffffff30;background:#00000040;color:var(--cream);font:800 15px var(--fb);text-align:center}

/* dock */
.dock{display:flex;align-items:center;gap:8px;padding-block:8px calc(8px + env(safe-area-inset-bottom,0px));overflow-x:auto}
.nav{display:flex;gap:6px;flex:1;justify-content:center}
.nv{flex:none;padding:7px 12px;border-radius:12px;background:#ffffff12;font-weight:900;font-size:13px;white-space:nowrap}
.nv.on{background:var(--gold);color:var(--ink)}
.ic{flex:none;width:40px;height:36px;border-radius:12px;background:#ffffff12;font-weight:900;font-size:16px}
.ic:hover,.nv:hover{background:#ffffff26}
.nv.on:hover{background:var(--gold)}
.float{position:fixed;font-family:var(--fd);font-size:44px;color:var(--gold);text-shadow:0 3px 0 #7a4a00;pointer-events:none;z-index:60;animation:fl 1.1s forwards}
@keyframes fl{to{transform:translateY(-90px);opacity:0}}
.hint{font-size:12px;opacity:.6;text-align:center}

@media (max-width:860px){
  body{overflow:auto}
  .stage.gR .content,.stage.gL .content{left:0;right:0}
  .girl,.bubble{display:none}
  .opts,.missions,.awards{grid-template-columns:minmax(0,1fr)}
  .deck{grid-template-columns:repeat(2,minmax(0,1fr))}
  .logo span{display:none}
  .adj{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head><body>

<div class="app" id="app">
  <header class="top">
    <div class="team p">
      <img src="a/team_phoenix.webp" alt="Phoenix emblem">
      <div class="tn" id="nP">Phoenix<small>Red team</small></div>
      <div class="score" id="sP">0</div>
      <div class="adj"><button data-adj="P,5" aria-label="Add 5 to Phoenix">+</button><button data-adj="P,-5" aria-label="Take 5 from Phoenix">−</button></div>
    </div>
    <div class="logo"><img src="a/logo.webp" alt="Admire Academy"><div><b>ENGLISH MASTERS</b><span id="roundLbl">Admire Academy</span></div></div>
    <div class="team e">
      <div class="adj"><button data-adj="E,5" aria-label="Add 5 to Eagles">+</button><button data-adj="E,-5" aria-label="Take 5 from Eagles">−</button></div>
      <div class="score" id="sE">0</div>
      <div class="tn" id="nE" style="text-align:right">Eagles<small>Blue team</small></div>
      <img src="a/team_eagle.webp" alt="Eagles emblem">
    </div>
  </header>
  <main class="stage gR" id="stage">
    <div class="content" id="content"></div>
    <div class="girl" id="girl"><img src="a/girl_anim.gif" alt=""></div>
    <div class="bubble" id="bubble"></div>
  </main>
  <nav class="dock">
    <button class="ic" id="prev" aria-label="Previous screen">◀</button>
    <div class="nav" id="nav"></div>
    <button class="ic" id="next" aria-label="Next screen">▶</button>
    <button class="ic" id="mute" aria-label="Sound on or off">🔊</button>
    <button class="ic" id="fs" aria-label="Full screen">⛶</button>
  </nav>
</div>
<canvas id="confetti"></canvas>

<script>
/* ============ QUESTIONS — edit freely ============ */
const DATA={
 r1:[ // Quick Fire: Grammar & Vocab
  {q:'She ___ to school every day.',o:['go','goes','going','gone'],a:1},
  {q:'What is the opposite of "generous"?',o:['selfish','kind','brave','honest'],a:0},
  {q:'If I ___ rich, I would travel the world.',o:['am','will be','were','been'],a:2},
  {q:'Choose a synonym for "huge".',o:['tiny','enormous','narrow','quiet'],a:1},
  {q:'They have lived here ___ 2015.',o:['for','from','at','since'],a:3},
  {q:'What is the plural of "child"?',o:['childs','children','childes','childrens'],a:1},
  {q:'By the time we arrived, the film ___.',o:['started','has started','had started','starts'],a:2},
  {q:'Which word is an adverb?',o:['quick','quickly','quickness','quicker'],a:1},
  {q:'This is the ___ book I have ever read.',o:['good','better','most good','best'],a:3},
  {q:'"Reluctant" means…',o:['unwilling','excited','careful','lucky'],a:0}
 ],
 r2:[ // Grammar Detectives: s = sentence, bad = indexes of wrong words
  {s:'He don\'t like cold weather.',bad:[1],fix:'He doesn\'t like cold weather.',why:'With he / she / it, the present simple negative uses "doesn\'t".'},
  {s:'I have seen him yesterday.',bad:[1,2],fix:'I saw him yesterday.',why:'"Yesterday" is finished time, so we use the past simple, not the present perfect.'},
  {s:'She is more taller than her sister.',bad:[2],fix:'She is taller than her sister.',why:'Short adjectives add -er. Never use "more" with an -er comparative.'},
  {s:'Every students must bring their books.',bad:[1],fix:'Every student must bring their books.',why:'"Every" is followed by a singular noun.'},
  {s:'If it will rain, we will stay home.',bad:[2,3],fix:'If it rains, we will stay home.',why:'First conditional: if + present simple, then will + verb.'},
  {s:'The news are very good today.',bad:[2],fix:'The news is very good today.',why:'"News" is uncountable, so it takes a singular verb.'}
 ],
 r3:{ // Listen Up
  choose:[
   {say:'Sara missed the bus this morning, so she walked to school and arrived ten minutes late.',q:'How did Sara get to school?',o:['by bus','on foot','by car','by bike'],a:1},
   {say:'The museum opens at nine o\'clock, but on Fridays it stays open until eight in the evening.',q:'When does the museum close on Fridays?',o:['9 am','6 pm','8 pm','9 pm'],a:2}
  ],
  complete:[
   {say:'Reading every day helps you learn new words and improves your writing.',gap:'Reading every day helps you learn new ____ and improves your ____.',ans:'words · writing'},
   {say:'Please remember to switch off the lights before you leave the classroom.',gap:'Please remember to ____ off the lights before you ____ the classroom.',ans:'switch · leave'}
  ],
  express:[
   {say:'Imagine you could change one thing about your school. What would you change, and why?'},
   {say:'Describe your favourite place to relax in three sentences.'}
  ]
 },
 r4:['Social media: good or bad for teenagers?','The best invention of all time','Should homework be banned?','My dream job','How can we protect our planet?','A person who inspires me','Life in the year 2050','Online learning vs. the classroom'],
 r5:[
  'Your school wants to cut plastic waste by half this year. Plan a campaign: give it a name, three actions and a slogan.',
  'A new student who speaks little English joins your class. How will your team help them feel welcome in their first week?',
  'Teenagers in your town have no safe place to spend free time. Propose a project: what is it, who does it help, and how will you pay for it?',
  'Students spend most of their break time on their phones. Design a fun challenge that changes this habit.'
 ]
};

/* ============ state ============ */
const SCREENS=[
 {id:'home',nav:'Start'},{id:'teams',nav:'Teams'},
 {id:'r1',nav:'R1 Quick Fire',lbl:'Round 1 · Quick Fire'},{id:'r2',nav:'R2 Detectives',lbl:'Round 2 · Grammar Detectives'},
 {id:'r3',nav:'R3 Listen Up',lbl:'Round 3 · Listen Up'},{id:'r4',nav:'R4 Topic Cards',lbl:'Round 4 · Topic Cards'},
 {id:'r5',nav:'R5 Mission',lbl:'Round 5 · Ultimate Team Mission'},{id:'win',nav:'Winner',lbl:'And the winner is…'},{id:'awards',nav:'Awards',lbl:'Round 6 · Awards'}
];
const fresh=()=>({screen:0,P:0,E:0,names:{P:'Phoenix',E:'Eagles',cP:'',cE:''},r1:{i:0,res:[]},r2:{i:0,done:[]},r3:{lvl:'choose',i:0},r4:{used:[],open:-1,team:'P'},r5:{used:[],cur:-1,team:'P'},aw:{l:'',s:''}});
let S;
function save(){try{localStorage.setItem('em-game',JSON.stringify(S))}catch(e){}}
function load(){try{const v=JSON.parse(localStorage.getItem('em-game'));if(v&&typeof v.P==='number')return Object.assign(fresh(),v)}catch(e){}return null}

/* ============ sound ============ */
let AC=null,muted=false;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){return null}}if(AC.state==='suspended')AC.resume();return AC}
function tone(f,d,type='sine',g=.25,at=0,slide){const c=ac();if(!c||muted)return;const t=c.currentTime+at,o=c.createOscillator(),v=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);v.gain.setValueAtTime(0,t);v.gain.linearRampToValueAtTime(g,t+.008);v.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(v).connect(c.destination);o.start(t);o.stop(t+d+.05)}
const SND={
 tick:()=>tone(1900,.05,'square',.06),
 beep:(hi)=>tone(hi?1250:1050,.18,'sine',.3),
 end:()=>{tone(220,.9,'square',.18);tone(440,.9,'sawtooth',.08)},
 ok:()=>[660,880,1320].forEach((f,i)=>tone(f,.22,'triangle',.25,i*.09)),
 no:()=>tone(320,.5,'sawtooth',.18,0,110),
 bP:()=>{tone(784,.25,'square',.15);tone(1175,.3,'triangle',.2,.08)},
 bE:()=>{tone(523,.25,'square',.15);tone(784,.3,'triangle',.2,.08)},
 flip:()=>tone(500,.15,'triangle',.15,0,900),
 swoosh:()=>tone(300,.25,'sine',.08,0,1200)
};

let TM=null;
function timerHTML(sec,label){return `<div class="timer" data-sec="${sec}"><div><div class="ring" id="ring"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" fill="#0a1638" stroke="#ffffff22" stroke-width="10"/><circle id="arc" cx="60" cy="60" r="52" fill="none" stroke="#ffc93c" stroke-width="10" stroke-linecap="round" stroke-dasharray="326.7" stroke-dashoffset="0"/></svg><div class="t" id="tt">${fmt(sec)}</div></div><div class="tl">${label||''}</div></div><div class="row" style="flex-direction:column;gap:6px"><button class="btn" id="tGo">▶ Start</button><button class="btn ghost" id="tReset">↺ Reset</button></div></div>`}
function fmt(s){s=Math.max(0,Math.ceil(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function mountTimer(sec,onEnd){stopTimer();const st={sec,left:sec,run:false,last:null,raf:0,lastWhole:sec};TM=st;
 const go=$('#tGo'),rs=$('#tReset'),ring=$('#ring'),arc=$('#arc'),tt=$('#tt');
 function draw(){tt.textContent=fmt(st.left);arc.style.strokeDashoffset=326.7*(1-st.left/st.sec);
  const w=st.left<=3&&st.left>0;ring.classList.toggle('warn',w);ring.classList.toggle('done',st.left<=0);arc.setAttribute('stroke',w||st.left<=0?'#ff5a50':'#ffc93c')}
 function loop(ts){if(!st.run)return;if(st.last!=null)st.left-=(ts-st.last)/1000;st.last=ts;
  const whole=Math.ceil(st.left);if(whole<st.lastWhole&&whole>0){st.lastWhole=whole;whole<=3?SND.beep(whole===1):SND.tick()}
  if(st.left<=0){st.left=0;st.run=false;draw();SND.end();go.textContent='▶ Start';onEnd&&onEnd();return}
  draw();st.raf=requestAnimationFrame(loop)}
 st.start=()=>{if(st.left<=0)st.reset();ac();st.run=true;st.last=null;go.textContent='❚❚ Pause';SND.tick();st.raf=requestAnimationFrame(loop)};
 st.pause=()=>{st.run=false;cancelAnimationFrame(st.raf);go.textContent='▶ Resume'};
 st.reset=()=>{st.pause();st.left=st.sec;st.lastWhole=st.sec;go.textContent='▶ Start';draw()};
 st.toggle=()=>st.run?st.pause():st.start();
 go.onclick=st.toggle;rs.onclick=st.reset;draw();return st}
function stopTimer(){if(TM){TM.run=false;cancelAnimationFrame(TM.raf)}TM=null}

 <div class="awards">
  <div class="card aw"><img src="a/b_FaMedal.webp" alt=""><h3>Gold medals</h3><p>Winning team</p><div style="font-family:var(--fd);font-size:24px;color:${w==='P'?'var(--redl)':'var(--bluel)'}">${TN(w)}</div></div>
  <div class="card aw"><img src="a/b_FaAward.webp" alt=""><h3>Silver medals</h3><p>Runners-up</p><div style="font-family:var(--fd);font-size:24px;color:${r==='P'?'var(--redl)':'var(--bluel)'}">${TN(r)}</div></div>
  <div class="card aw"><img src="a/b_FaHeadphones.webp" alt=""><h3>Best Listener</h3><p>Sharpest ears</p><input id="awL" value="${esc(S.aw.l)}" placeholder="Student's name" aria-label="Best Listener name"></div>
  <div class="card aw"><img src="a/b_FaMicrophoneAlt.webp" alt=""><h3>Best Speaker</h3><p>Most confident voice</p><input id="awS" value="${esc(S.aw.s)}" placeholder="Student's name" aria-label="Best Speaker name"></div>
 </div>
 <div class="card" style="text-align:center;font-weight:900;font-size:clamp(16px,1.6vw,22px)">📜 Certificates for every participant — thank you for being English Masters!</div>
 <button class="btn" id="cheer">👏 Applause</button>`};
function bindAwards(){$('#awL').oninput=e=>{S.aw.l=e.target.value;save()};$('#awS').oninput=e=>{S.aw.s=e.target.value;save()};$('#cheer').onclick=()=>{play(clap);confetti()}}

const BIND={teams:bindTeams,r1:bindR1,r2:bindR2,r3:bindR3,r4:bindR4,r5:bindR5,win:bindWin,awards:bindAwards,home:()=>{$('#newGame').onclick=()=>{const ng=$('#newGame');if(ng.dataset.sure){S=fresh();save();paintScores();render()}else{ng.dataset.sure=1;ng.textContent='Click again to confirm'}}}};

/* ============ confetti ============ */
function confetti(){const c=$('#confetti'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
 const cols=['#ffc93c','#ffffff','#e53935','#3d7bff','#f5b52a'];const P=Array.from({length:180},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,vx:(Math.random()-.5)*3,vy:2+Math.random()*4,r:Math.random()*6,w:6+Math.random()*8,h:4+Math.random()*5,c:cols[Math.random()*5|0]}));
 let f=0;(function step(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=.1;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.w/2,-p.h/2,p.w,p.h);x.restore()});if(++f<260)requestAnimationFrame(step);else x.clearRect(0,0,c.width,c.height)})()}

/* ============ shell ============ */
function render(){stopTimer();const sc=SCREENS[S.screen];const c=$('#content');c.innerHTML=R[sc.id]();c.scrollTop=0;
 const st=$('#stage');st.classList.toggle('gR',S.screen%2===0);st.classList.toggle('gL',S.screen%2===1);
 const b=$('#bubble');b.textContent=SAY[sc.id];b.style.animation='none';void b.offsetWidth;b.style.animation='';
 $('#roundLbl').textContent=sc.lbl||'Admire Academy';
 document.querySelectorAll('.nv').forEach((n,k)=>n.classList.toggle('on',k===S.screen));
 const on=document.querySelector('.nv.on');on&&on.scrollIntoView({block:'nearest',inline:'center'});
 BIND[sc.id]&&BIND[sc.id]();
 document.querySelectorAll('[data-aw]').forEach(b=>b.onclick=()=>{const[t,p]=b.dataset.aw.split(',');award(t,+p,b)});
 document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(+b.dataset.go))}
function go(n){n=Math.max(0,Math.min(SCREENS.length-1,n));if(n===S.screen)return;stopAud();S.screen=n;save();SND.swoosh();render()}

function start(snap){
 S=(snap&&snap.S)||load()||fresh();
 $('#nav').innerHTML=SCREENS.map((s,k)=>`<button class="nv" data-n="${k}">${s.nav}</button>`).join('');
 document.querySelectorAll('.nv').forEach(b=>b.onclick=()=>go(+b.dataset.n));
 $('#prev').onclick=()=>go(S.screen-1);$('#next').onclick=()=>go(S.screen+1);
 $('#mute').onclick=()=>{muted=!muted;$('#mute').textContent=muted?'🔇':'🔊';if(muted)stopAud()};
 $('#fs').onclick=()=>{try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{})}catch(e){}};
 document.querySelectorAll('[data-adj]').forEach(b=>b.onclick=()=>{const[t,p]=b.dataset.adj.split(',');award(t,+p)});
 document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;
  if(e.key==='ArrowRight')go(S.screen+1);else if(e.key==='ArrowLeft')go(S.screen-1);
  else if(e.key===' '&&TM){e.preventDefault();TM.toggle()}
  else if(S.screen===2&&(e.key==='a'||e.key==='A'))buzz('P');else if(S.screen===2&&(e.key==='l'||e.key==='L'))buzz('E')});
 document.addEventListener('pointerdown',()=>ac(),{once:true});
 paintScores();render();
 window.claude?.hot?.snapshot?.(()=>({S}));
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
</body></html>
