.layer{position:absolute;inset:0}
.hidden{display:none!important}
button{font-family:inherit;cursor:pointer;border:none;outline:none}
.nk{font-family:'Noto Naskh Arabic','Traditional Arabic','Arial',serif;font-weight:700}
@keyframes pulse{0%,100%{scale:1}50%{scale:1.07}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-18px) rotate(2deg)}}
@keyframes hop{0%,100%{transform:translateY(0)}30%{transform:translateY(-90px) rotate(-6deg)}60%{transform:translateY(0)}75%{transform:translateY(-30px)}}
@keyframes popin{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes cardin{from{transform:translateY(120px) scale(.6);opacity:0}to{transform:none;opacity:1}}
@keyframes shake{0%,100%{translate:0}15%{translate:-30px}30%{translate:26px}45%{translate:-20px}60%{translate:14px}75%{translate:-8px}}
@keyframes glow{0%,100%{box-shadow:0 0 0 14px #4ade80,0 0 60px 20px rgba(74,222,128,.8)}50%{box-shadow:0 0 0 20px #86efac,0 0 90px 30px rgba(134,239,172,.9)}}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.credit{position:absolute;bottom:14px;left:26px;font-size:26px;font-weight:800;color:#fff;text-shadow:0 2px 4px rgba(0,0,0,.7);z-index:95;pointer-events:none}
.topbtns{position:absolute;top:22px;left:26px;display:flex;gap:16px;z-index:80}
.ibtn{width:90px;height:90px;border-radius:24px;background:rgba(255,255,255,.92);border:5px solid #fff;box-shadow:0 8px 0 rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center}
.ibtn svg{width:50px;height:50px}
.ibtn:active{transform:translateY(5px)}
/* start */
#start{z-index:50;display:flex;align-items:center;justify-content:center}
#start .mascot{position:absolute;left:150px;bottom:40px;height:820px;animation:bob 3s ease-in-out infinite;filter:drop-shadow(0 20px 20px rgba(0,0,0,.25))}
.sbox{position:absolute;right:140px;top:90px;width:1000px;display:flex;flex-direction:column;align-items:center;text-align:center}
.sbadge{font-size:40px;font-weight:800;color:#fff;background:#ff7a59;padding:12px 40px 6px;border-radius:50px;border:5px solid #fff;box-shadow:0 8px 0 #c2410c}
.stitle{margin-top:20px;font-size:104px;line-height:1.5;color:#fff;-webkit-text-stroke:8px #1e5fa8;paint-order:stroke fill;text-shadow:0 10px 0 #1e5fa8}
.bigkh{margin-top:0;width:330px;height:330px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff,#ffe9a8);border:12px solid #fff;box-shadow:0 14px 0 #e0a800,0 24px 40px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;font-size:250px;color:#e11d48;line-height:1;padding-bottom:40px;animation:pulse 2s ease-in-out infinite}
.go{margin-top:46px;font-size:80px;font-weight:800;color:#fff;padding:24px 110px 14px;border-radius:70px;background:linear-gradient(#4ade80,#16a34a);border:8px solid #fff;box-shadow:0 14px 0 #166534,0 24px 40px rgba(0,0,0,.3);animation:pulse 1.5s ease-in-out infinite}
.go:active{translate:0 8px}
/* game */
#game{z-index:20}
.hdr{position:absolute;top:22px;right:30px;display:flex;align-items:center;gap:22px}
.hkh{width:120px;height:120px;border-radius:30px;background:#fff;border:6px solid #ffc62b;display:flex;align-items:center;justify-content:center;font-size:96px;color:#e11d48;padding-bottom:18px;box-shadow:0 8px 0 rgba(0,0,0,.15)}
.stars{display:flex;gap:12px;background:rgba(255,255,255,.85);border:5px solid #fff;border-radius:40px;padding:12px 22px;box-shadow:0 8px 0 rgba(0,0,0,.12)}
.st{width:70px;height:70px}
.st path{fill:#e5e7eb;stroke:#cbd5e1;stroke-width:4;transition:fill .3s}
.st.on path{fill:#FFD34D;stroke:#d97706}
.st.on{animation:popin .5s cubic-bezier(.3,1.8,.5,1)}
#gmascot{position:absolute;left:30px;bottom:30px;height:520px;filter:drop-shadow(0 16px 14px rgba(0,0,0,.25));transform-origin:50% 100%;animation:bob 3s ease-in-out infinite}
#gmascot.hop{animation:hop 1s ease}
.bubble{position:absolute;left:330px;top:40px;transform:none;background:#fff;border:6px solid #1e5fa8;border-radius:50px;padding:18px 44px 8px;font-size:58px;font-weight:800;color:#1e3a8a;white-space:nowrap;box-shadow:0 10px 0 rgba(0,0,0,.12)}
.bubble b{color:#e11d48;font-size:78px}
.cards{position:absolute;right:120px;left:430px;top:220px;height:680px;display:flex;gap:56px;justify-content:center;align-items:center}
.card{width:420px;height:600px;border-radius:50px;background:#fff;border:10px solid #fff;box-shadow:0 16px 0 rgba(0,0,0,.15),0 26px 40px rgba(0,0,0,.2);display:flex;flex-direction:column;align-items:center;overflow:hidden;position:relative;animation:cardin .6s cubic-bezier(.3,1.5,.5,1) both;transition:transform .2s,opacity .4s,filter .4s}
.card:nth-child(2){animation-delay:.12s}.card:nth-child(3){animation-delay:.24s}
.card:active{transform:scale(.96)}
.card img{width:400px;height:400px;object-fit:cover;border-radius:40px;display:block;pointer-events:none}
.card .w{flex:1;display:flex;align-items:center;justify-content:center;font-size:96px;color:#1f2937;line-height:1.2;padding-bottom:10px}
.card.wrong{animation:shake .6s;filter:grayscale(.85) brightness(.9);opacity:.55;pointer-events:none}
.card .xx{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:220px;opacity:0;transition:opacity .2s;pointer-events:none}
.card.wrong .xx{opacity:1}
.card.right{animation:glow 1.2s ease-in-out infinite;z-index:3}
.card.fade{animation:none;opacity:.25;transform:scale(.9);pointer-events:none}
.cards.lock .card{pointer-events:none}
.kh{color:#e11d48}
.card .kh{color:inherit;transition:color .3s}
.card.right .kh{color:#e11d48}
/* reveal */
#reveal{position:absolute;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,0);pointer-events:none;opacity:0;transition:opacity .4s}
#reveal.show{opacity:1;pointer-events:auto;background:rgba(20,60,110,.35)}
.rv{width:1500px;height:760px;border-radius:60px;background:linear-gradient(#fffdf2,#fff3c4);border:12px solid #ffc62b;box-shadow:0 20px 0 #d39b00,0 40px 80px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:space-around;padding:40px;transform:scale(.3);transition:transform .55s cubic-bezier(.3,1.5,.5,1);position:relative}
#reveal.show .rv{transform:none}
.rv img{width:520px;height:520px;border-radius:50px;object-fit:cover;border:10px solid #fff;box-shadow:0 12px 24px rgba(0,0,0,.2)}
.rvt{display:flex;flex-direction:column;align-items:center;gap:10px}
.rvk{font-size:330px;line-height:1.05;color:#e11d48;text-shadow:0 10px 0 #fecdd3;padding-bottom:30px}
.rvw{font-size:150px;color:#1f2937;line-height:1.3}
.rvok{position:absolute;top:-60px;right:80px;background:#22c55e;color:#fff;font-size:56px;font-weight:800;padding:14px 50px 6px;border-radius:50px;border:7px solid #fff;box-shadow:0 8px 0 #15803d}
.next{position:absolute;bottom:-56px;left:50%;transform:translateX(-50%);font-size:60px;font-weight:800;color:#fff;padding:16px 80px 8px;border-radius:60px;background:linear-gradient(#60a5fa,#2563eb);border:7px solid #fff;box-shadow:0 10px 0 #1e40af;animation:pulse 1.4s infinite}
.bigstar{position:absolute;top:-100px;left:60px;width:220px;height:220px;animation:spin 6s linear infinite;filter:drop-shadow(0 0 30px #ffd34d)}
/* wrong toast */
#bad{position:absolute;left:50%;top:150px;transform:translateX(-50%) scale(.3);opacity:0;z-index:45;background:#fff;border:8px solid #fb923c;border-radius:50px;padding:14px 50px 6px;font-size:64px;font-weight:800;color:#c2410c;transition:all .35s cubic-bezier(.3,1.6,.5,1);pointer-events:none;white-space:nowrap}
#bad.show{opacity:1;transform:translateX(-50%) scale(1)}
/* finale */
#finale{z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,rgba(255,236,150,.85),rgba(30,95,168,.75) 70%)}
#finale .mascot{position:absolute;left:90px;bottom:30px;height:640px;animation:hop 1.2s ease infinite}
.ft{font-size:150px;line-height:1.5;color:#fff;-webkit-text-stroke:9px #b45309;paint-order:stroke fill;text-shadow:0 12px 0 #b45309;animation:popin .7s cubic-bezier(.3,1.7,.5,1) both}
.fstars{display:flex;gap:18px;margin-top:10px}
.fstars svg{width:120px;height:120px;animation:popin .5s cubic-bezier(.3,1.8,.5,1) both}

// [first letter+haraka, rest]
const KH=[['khuruf','خَ','رُوفٌ'],['khayma','خَ','يْمَةٌ'],['khawkh','خَ','وْخٌ'],['khiyar','خِ','يَارٌ'],['khubz','خُ','بْزٌ'],['khatam','خَ','اتَمٌ']];
const OTHER=[['batta','بَطَّةٌ'],['tuffaha','تُفَّاحَةٌ'],['samaka','سَمَكَةٌ'],['qalam','قَلَمٌ'],['mawz','مَوْزٌ'],['shams','شَمْسٌ']];
const ZWJ='\u200d';
const STAR='<svg viewBox="0 0 100 100" class="st"><path d="M50 5l13 28 30 3-23 20 7 30-27-16-27 16 7-30L7 36l30-3z" stroke-linejoin="round"/></svg>';
/* audio */
let AC=null,soundOn=true;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function tone(f,d,type,vol,f2,delay){const a=ac();if(!a||!soundOn)return;const t=a.currentTime+(delay||0),o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol||.3,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.05);}
const SFX={click(){tone(700,.08,'triangle',.25);},pop(){tone(500,.15,'sine',.3,1000);},
 right(){[523,659,784,1047].forEach((f,i)=>tone(f,.35,'triangle',.28,0,i*.09));tone(1568,.6,'sine',.15,0,.4);},
 wrong(){tone(260,.18,'square',.12,180);tone(180,.3,'square',.12,120,.18);},
 boing(){tone(200,.35,'sine',.3,600);},
 win(){[523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,.4,'triangle',.25,0,[0,.15,.3,.45,.7,.85,1.05][i]));}};
let arVoice=null;
function pickVoice(){if(!('speechSynthesis' in window))return;const vs=speechSynthesis.getVoices().filter(v=>/^ar/i.test(v.lang));arVoice=vs.find(v=>/female|zeina|hoda|salma|laila|layla|mariam|amira|zariyah|fatima|sana|noura|hala/i.test(v.name))||vs.find(v=>/google/i.test(v.name))||vs[0]||null;}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}
function say(t){if(!soundOn||!('speechSynthesis' in window))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang=arVoice?arVoice.lang:'ar-SA';if(arVoice)u.voice=arVoice;u.rate=.85;u.pitch=1.2;speechSynthesis.speak(u);}catch(e){}}
/* game */
let rounds=[],ri=0,score=0,busy=false;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
function build(){
  const order=shuffle(KH.slice()), d=shuffle(OTHER.slice().concat(OTHER.slice()));
  rounds=order.map((k,i)=>{let a=d[i*2],b=d[i*2+1];if(a[0]===b[0]){const j=(i*2+2)%d.length;[d[i*2+1],d[j]]=[d[j],d[i*2+1]];b=d[i*2+1];}
    return shuffle([{k:k[0],html:'<span class="kh">'+k[1]+ZWJ+'</span>'+ZWJ+k[2],right:true,word:k},{k:a[0],html:a[1]},{k:b[0],html:b[1]}]);});
}
function drawStars(){$('stars').innerHTML=Array.from({length:6},(_,i)=>STAR.replace('class="st"','class="st'+(i<score?' on':'')+'"')).join('');}
function showRound(){
  busy=false; const c=$('cards'); c.innerHTML=''; c.classList.remove('lock');
  rounds[ri].forEach((it,idx)=>{const el=document.createElement('div');el.className='card';el.dataset.idx=idx;if(it.right)el.dataset.right='1';
    el.innerHTML='<img src="'+IMG[it.k]+'" alt=""><div class="w nk">'+it.html+'</div><div class="xx">❌</div>';
    el.addEventListener('click',()=>tap(el,it));c.appendChild(el);});
}
function tap(el,it){
  if(busy)return; ac();
  if(it.right){
    busy=true; $('cards').classList.add('lock'); el.classList.add('right');
    document.querySelectorAll('.card').forEach(x=>{if(x!==el)x.classList.add('fade');});
    SFX.right(); say('إِجَابَةٌ صَحِيحَةٌ'); score++; drawStars();
    const m=$('gmascot'); m.classList.remove('hop'); void m.offsetWidth; m.classList.add('hop'); SFX.boing();
    burst(el);
    setTimeout(()=>{$('rvWord').innerHTML=it.html;$('rvImg').src=IMG[it.k];$('reveal').classList.add('show');SFX.pop();},1100);
  } else {
    el.classList.add('wrong'); SFX.wrong(); say('إِجَابَةٌ خَاطِئَةٌ');
    const b=$('bad'); b.classList.add('show'); clearTimeout(b._t); b._t=setTimeout(()=>b.classList.remove('show'),1300);
  }
}
function next(){
  if(!$('reveal').classList.contains('show'))return;
  SFX.click(); $('reveal').classList.remove('show'); ri++;
  if(ri>=rounds.length){setTimeout(finale,400);} else setTimeout(showRound,350);
}
$('btnNext').addEventListener('click',next);
function start(){ac();SFX.click();build();ri=0;score=0;drawStars();stopConf();
  $('start').classList.add('hidden');$('finale').classList.add('hidden');$('game').classList.remove('hidden');showRound();}
function finale(){
  $('game').classList.add('hidden');$('finale').classList.remove('hidden');
  $('fstars').innerHTML=Array.from({length:6},(_,i)=>'<svg viewBox="0 0 100 100" style="animation-delay:'+(.3+i*.15)+'s"><path d="M50 5l13 28 30 3-23 20 7 30-27-16-27 16 7-30L7 36l30-3z" stroke-linejoin="round"/></svg>').join('');
  SFX.win(); startConf();
}
function home(){SFX.click();stopConf();$('reveal').classList.remove('show');$('game').classList.add('hidden');$('finale').classList.add('hidden');$('start').classList.remove('hidden');}
$('btnStart').addEventListener('click',start);
$('btnAgain').addEventListener('click',start);
$('btnHome').addEventListener('click',home);
$('btnSound').addEventListener('click',()=>{soundOn=!soundOn;$('sndIcon').innerHTML=soundOn?'<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4z"/>':'<path d="M3 9v6h4l5 5V4L7 9H3zm13.6 3 2.7-2.7-1.4-1.4-2.7 2.7-2.7-2.7-1.4 1.4 2.7 2.7-2.7 2.7 1.4 1.4 2.7-2.7 2.7 2.7 1.4-1.4z"/>';if(!soundOn){try{speechSynthesis.cancel();}catch(e){}}else SFX.click();});
$('btnFull').addEventListener('click',()=>{const d=document,el=d.documentElement;if(!d.fullscreenElement&&!d.webkitFullscreenElement){(el.requestFullscreen||el.webkitRequestFullscreen).call(el);}else{(d.exitFullscreen||d.webkitExitFullscreen).call(d);}});
/* fx */
const fx=$('fx'),c2=fx.getContext('2d');let parts=[],conf=false,raf=0;
const COLS=['#FFC62B','#ff4d6d','#4cc9f0','#80ed99','#c77dff','#ffffff','#fb923c'];
function burst(el){const r=el.getBoundingClientRect(),sr=stage.getBoundingClientRect();const cx=(r.left+r.width/2-sr.left)/S,cy=(r.top+r.height/2-sr.top)/S;
  for(let i=0;i<70;i++){const a=Math.random()*Math.PI*2,s=6+Math.random()*14;parts.push({x:cx,y:cy,vx:Math.cos(a)*s,vy:Math.sin(a)*s-6,r:Math.random()*6,vr:(Math.random()-.5)*.4,w:14+Math.random()*12,h:10+Math.random()*8,c:COLS[i%COLS.length],life:80,star:i%3===0});}
  if(!raf)loop();}
function startConf(){conf=true;if(!raf)loop();}
function stopConf(){conf=false;}
function loop(){
  c2.clearRect(0,0,1920,1080);
  if(conf&&parts.length<260)for(let i=0;i<4;i++)parts.push({x:Math.random()*1920,y:-20,vx:(Math.random()-.5)*3,vy:3+Math.random()*4,r:Math.random()*6,vr:(Math.random()-.5)*.3,w:14+Math.random()*12,h:8+Math.random()*8,c:COLS[Math.random()*7|0],life:400,star:Math.random()<.2});
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.35;p.vx*=.99;p.r+=p.vr;p.life--;if(p.life<=0||p.y>1120){parts.splice(i,1);continue;}
    c2.save();c2.translate(p.x,p.y);c2.rotate(p.r);c2.fillStyle=p.c;
    if(p.star){c2.beginPath();for(let k=0;k<10;k++){const rr=k%2?7:16,a=k*Math.PI/5;c2.lineTo(Math.cos(a)*rr,Math.sin(a)*rr);}c2.fill();}
    else c2.fillRect(-p.w/2,-p.h/2,p.w,p.h*Math.abs(Math.cos(p.r*2)));c2.restore();}
  if(parts.length||conf)raf=requestAnimationFrame(loop);else{raf=0;c2.clearRect(0,0,1920,1080);}
}
Object.assign(G,{round:()=>ri,score:()=>score,state:()=>!$('finale').classList.contains('hidden')?'finale':!$('game').classList.contains('hidden')?'game':'start'});
drawStars();
